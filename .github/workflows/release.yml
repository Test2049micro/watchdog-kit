name: release

# Publishing is triggered by a version tag only, never by a push to main:
# an ordinary commit must not be able to put a package on PyPI.
on:
  push:
    tags: ["v[0-9]*"]

# Grant write permissions only to jobs that publish artifacts.
permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    # Create this Environment on the repo (Settings -> Environments -> "pypi"),
    # then point PyPI's "Trusted Publisher" at it. No credential is ever stored
    # here: the action exchanges the workflow's OIDC token for a short-lived one.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          pip install build
          python -m build
      # checked before upload: a broken long_description is rejected by PyPI, and
      # finding that out from the upload error is slower than checking locally here
      - name: check metadata
        run: |
          pip install twine
          twine check dist/*
      - name: publish
        # pinned to the commit that v1.14.2 points at, not to the moving
        # release/v1 branch: this step receives short-lived credentials for your
        # package index, so upstream should not be able to change under us.
        # v1.14.2 is an annotated tag, so its tag object sha is NOT usable here;
        # this is the dereferenced commit (currently also release/v1's head).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
