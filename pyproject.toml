[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-kit"
version = "0.1.0"
description = "Change-only monitoring primitives for scheduled jobs and recorded agent runs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["launchd", "monitoring", "alert-fatigue", "cron", "agent-runs", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
watchdog-kit = "watchdog_kit.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
